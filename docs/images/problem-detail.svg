    <rect x="634" y="177" width="70" height="26" rx="7" fill="#222d52"/>
    <text x="669" y="195" text-anchor="middle" fill="#7c98ff" font-size="11" font-weight="750">Python 3</text>
    <text x="715" y="195" class="faint" font-size="11">已保存</text>
    <rect x="1270" y="176" width="78" height="28" rx="8" class="button"/><text x="1309" y="195" text-anchor="middle" class="muted" font-size="11">−　14　＋</text>
    <text x="1360" y="195" class="muted" font-size="11">重置模板</text>

    <rect x="620" y="212" width="820" height="332" fill="#171d2a"/>
    <g class="mono code">
      <text x="645" y="246" fill="#58647a">1</text><text x="677" y="246" fill="#b7c4ff">class</text><text x="720" y="246" class="text"> Solution:</text>
      <text x="645" y="275" fill="#58647a">2</text><text x="701" y="275" fill="#b7c4ff">def</text><text x="728" y="275" fill="#9bd7c4"> twoSum</text><text x="784" y="275" class="text">(self, nums, target):</text>
      <text x="645" y="304" fill="#58647a">3</text><text x="725" y="304" class="text">seen = {}</text>
      <text x="645" y="333" fill="#58647a">4</text><text x="725" y="333" fill="#b7c4ff">for</text><text x="751" y="333" class="text"> index, value </text><text x="852" y="333" fill="#b7c4ff">in</text><text x="871" y="333" class="text"> enumerate(nums):</text>
      <text x="645" y="362" fill="#58647a">5</text><text x="749" y="362" class="text">needed = target - value</text>
      <text x="645" y="391" fill="#58647a">6</text><text x="749" y="391" fill="#b7c4ff">if</text><text x="768" y="391" class="text"> needed </text><text x="829" y="391" fill="#b7c4ff">in</text><text x="848" y="391" class="text"> seen:</text>
      <text x="645" y="420" fill="#58647a">7</text><text x="773" y="420" fill="#b7c4ff">return</text><text x="821" y="420" class="text"> [seen[needed], index]</text>
      <text x="645" y="449" fill="#58647a">8</text><text x="749" y="449" class="text">seen[value] = index</text>
      <text x="645" y="478" fill="#58647a">9</text>
    </g>
