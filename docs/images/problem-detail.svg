    <text x="62" y="175" text-anchor="middle" fill="#5fd0a5" font-size="11" font-weight="650">简单</text>
    <rect x="94" y="158" width="38" height="24" rx="7" fill="#252d3d"/><text x="113" y="175" text-anchor="middle" class="muted" font-size="11">数组</text>
    <rect x="140" y="158" width="38" height="24" rx="7" fill="#252d3d"/><text x="159" y="175" text-anchor="middle" class="muted" font-size="11">哈希</text>
    <text x="38" y="225" class="text" font-size="26" font-weight="780">1. 两数之和</text>
    <text x="38" y="268" class="text" font-size="15">给定一个整数数组 nums 和一个整数目标值 target，</text>
    <text x="38" y="295" class="text" font-size="15">请你在该数组中找出和为目标值的两个整数，并返回</text>
    <text x="38" y="322" class="text" font-size="15">它们的数组下标。</text>
    <text x="38" y="365" class="text" font-size="15">你可以假设每种输入只会对应一个答案，并且不能使用</text>
    <text x="38" y="392" class="text" font-size="15">两次相同的元素。</text>
    <text x="38" y="445" class="text" font-size="18" font-weight="730">示例 1</text>
    <rect x="38" y="462" width="540" height="132" rx="12" class="surface2" filter="url(#soft)"/>
    <text x="58" y="493" class="mono muted" font-size="13">输入：nums = [2, 7, 11, 15], target = 9</text>
    <text x="58" y="524" class="mono muted" font-size="13">输出：[0, 1]</text>
    <text x="58" y="555" class="mono muted" font-size="13">解释：nums[0] + nums[1] == 9</text>
    <text x="38" y="647" class="text" font-size="18" font-weight="730">提示</text>
    <text x="38" y="679" class="muted" font-size="14">• 2 ≤ nums.length ≤ 10⁴</text>
    <text x="38" y="706" class="muted" font-size="14">• -10⁹ ≤ nums[i], target ≤ 10⁹</text>
    <text x="38" y="733" class="muted" font-size="14">• 只会存在一个有效答案</text>
    <line x1="38" y1="785" x2="578" y2="785" stroke="#2b3446"/>
    <text x="38" y="817" class="faint" font-size="11">题面来自力扣 LC 题单的离线快照，仅用于个人学习。</text>

