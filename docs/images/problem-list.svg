    <path d="m1135 474 5 5 5-5" fill="none" stroke="#7f899e" stroke-width="1.5"/>
    <rect x="1168" y="457" width="169" height="40" rx="10" class="button"/>
    <text x="1252.5" y="482" text-anchor="middle" class="muted label">清除筛选</text>

    <rect x="90" y="532" width="1260" height="315" rx="18" class="surface" filter="url(#shadow)"/>
    <line x1="90" y1="592" x2="1350" y2="592" stroke="#2b3446"/>
    <rect x="112" y="548" width="29" height="29" rx="9" fill="#222d52"/>
    <text x="126.5" y="567" text-anchor="middle" fill="#7c98ff" font-size="11" font-weight="800">01</text>
    <text x="153" y="568" class="text" font-size="16" font-weight="760">哈希</text>
    <text x="1327" y="567" text-anchor="end" class="muted small">0 / 3 已通过</text>

    <g>
      <circle cx="126" cy="626" r="8" fill="none" stroke="#3a455a" stroke-width="1.5"/>
      <text x="151" y="631" class="faint small">1</text><text x="190" y="631" class="text" font-size="14" font-weight="590">两数之和</text>
      <rect x="1278" y="613" width="50" height="25" rx="12.5" fill="#183b33"/>
      <text x="1303" y="630" text-anchor="middle" fill="#5fd0a5" font-size="11" font-weight="650">简单</text>

      <rect x="103" y="649" width="1234" height="48" rx="10" fill="#1c2332"/>
      <circle cx="126" cy="673" r="8" fill="#3b2d18" stroke="#f1b457" stroke-width="1.5"/>
