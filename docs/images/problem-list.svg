      <rect x="724" y="322" width="301" height="98" rx="17" class="surface"/>
      <rect x="1041" y="322" width="309" height="98" rx="17" class="surface"/>
    </g>
    <text x="112" y="350" class="muted small">已通过</text>
    <text x="112" y="389" class="text" font-size="28" font-weight="790">0</text>
    <text x="132" y="389" class="faint small">/ 100</text>
    <text x="429" y="350" class="muted small">进行中</text>
    <text x="429" y="389" class="text" font-size="28" font-weight="790">1</text>
    <text x="449" y="389" class="faint small">道</text>
