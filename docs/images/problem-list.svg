    <text x="898" y="482" class="muted" font-size="13">全部难度</text>
    <path d="m992 474 5 5 5-5" fill="none" stroke="#7f899e" stroke-width="1.5"/>
    <rect x="1025" y="457" width="130" height="40" rx="10" fill="#1c2332" stroke="#2b3446"/>
