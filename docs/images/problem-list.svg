<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Python 离线训练场题目列表页</title>
  <desc id="desc">深色模式下的题目列表界面，包含离线状态、默认展开开关、进度概览、筛选工具栏和分类题目。</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151d2f"/>
      <stop offset="0.58" stop-color="#1a2742"/>
      <stop offset="1" stop-color="#252d50"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3157e8"/>
      <stop offset="1" stop-color="#6d43de"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.24"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .text { fill: #edf1f8; }
      .muted { fill: #a7b0c2; }
      .faint { fill: #7f899e; }
      .surface { fill: #171d2a; stroke: #2b3446; }
      .surface2 { fill: #1c2332; stroke: #2b3446; }
      .button { fill: #171d2a; stroke: #2b3446; }
      .small { font-size: 12px; }
      .label { font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <g class="ui">
    <rect width="1440" height="900" fill="#0f1420"/>
    <rect x="0.5" y="0.5" width="1439" height="67" fill="#171d2a" stroke="#2b3446"/>

    <rect x="26" y="14" width="40" height="40" rx="12" fill="url(#mark)"/>
    <text x="46" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">Py</text>
    <text x="78" y="31" class="text" font-size="15" font-weight="750">Python 离线训练场</text>
    <text x="78" y="50" class="muted" font-size="12">LC 算法题 · 题面、评测、题解与笔记</text>

    <rect x="967" y="19" width="88" height="31" rx="16" class="surface2"/>
    <circle cx="984" cy="34.5" r="4" fill="#5fd0a5"/>
    <circle cx="984" cy="34.5" r="8" fill="none" stroke="#5fd0a5" stroke-opacity=".15" stroke-width="4"/>
    <text x="996" y="39" class="muted small">完全离线</text>

    <rect x="1065" y="14" width="112" height="40" rx="10" class="button"/>
    <rect x="1077" y="26" width="28" height="16" rx="8" fill="#7c98ff"/>
    <circle cx="1097" cy="34" r="5" fill="#fff"/>
    <text x="1113" y="39" class="text label">默认展开</text>
    <rect x="1187" y="14" width="75" height="40" rx="10" class="button"/>
    <text x="1224.5" y="39" text-anchor="middle" class="text label">↥ 导入</text>
    <rect x="1272" y="14" width="75" height="40" rx="10" class="button"/>
    <text x="1309.5" y="39" text-anchor="middle" class="text label">↧ 导出</text>
    <rect x="1357" y="15" width="38" height="38" rx="10" class="button"/>
    <circle cx="1376" cy="34" r="7" fill="#edf1f8"/>
    <path d="M1376 27a7 7 0 0 0 0 14z" fill="#171d2a"/>

    <rect x="90" y="102" width="1260" height="198" rx="25" fill="url(#hero)" stroke="#2b3856" filter="url(#shadow)"/>
    <circle cx="1285" cy="282" r="128" fill="none" stroke="#8ea4de" stroke-opacity=".05" stroke-width="32"/>
    <circle cx="1285" cy="282" r="82" fill="none" stroke="#8ea4de" stroke-opacity=".08"/>
    <text x="124" y="145" fill="#91a5dc" font-size="11" font-weight="750" letter-spacing="2.4">OFFLINE ALGORITHM LAB</text>
    <text x="124" y="183" fill="#f3f5fb" font-size="25" font-weight="780">把题面、代码和笔记，放进一个离线文件</text>
    <text x="124" y="216" fill="#b8c2d8" font-size="14">一个文件，完整题面、本地 Python 评测、参考题解和个人 Markdown 笔记全部随身携带。</text>
    <text x="124" y="239" fill="#b8c2d8" font-size="14">无需账号，也无需网络。</text>
    <rect x="124" y="257" width="192" height="34" rx="9" fill="#dce4f7"/>
    <text x="220" y="279" text-anchor="middle" fill="#1d2b4d" font-size="12" font-weight="700">继续：1. 两数之和</text>
    <rect x="326" y="257" width="130" height="34" rx="9" fill="#97aadd" fill-opacity=".08" stroke="#aabbe7" stroke-opacity=".22"/>
    <text x="391" y="279" text-anchor="middle" fill="#d9e0f0" font-size="12" font-weight="650">随机一道未完成题</text>

    <circle cx="1248" cy="200" r="65" fill="#172139" stroke="#879bd0" stroke-opacity=".45" stroke-width="10"/>
    <path d="M1248 135a65 65 0 0 1 20 3" fill="none" stroke="#58c7a0" stroke-width="10" stroke-linecap="round"/>
    <text x="1248" y="198" text-anchor="middle" fill="#f3f5fb" font-size="30" font-weight="800">0%</text>
    <text x="1248" y="220" text-anchor="middle" fill="#aab7d1" font-size="12">总体进度</text>

