      <rect x="1278" y="660" width="50" height="25" rx="12.5" fill="#3b2d18"/>
      <text x="1303" y="677" text-anchor="middle" fill="#f1b457" font-size="11" font-weight="650">中等</text>

      <circle cx="126" cy="720" r="8" fill="none" stroke="#3a455a" stroke-width="1.5"/>
      <text x="151" y="725" class="faint small">128</text><text x="190" y="725" class="text" font-size="14" font-weight="590">最长连续序列</text>
      <rect x="1278" y="707" width="50" height="25" rx="12.5" fill="#3b2d18"/>
      <text x="1303" y="724" text-anchor="middle" fill="#f1b457" font-size="11" font-weight="650">中等</text>
    </g>

    <line x1="112" y1="754" x2="1328" y2="754" stroke="#2b3446"/>
    <rect x="112" y="772" width="29" height="29" rx="9" fill="#222d52"/>
    <text x="126.5" y="791" text-anchor="middle" fill="#7c98ff" font-size="11" font-weight="800">02</text>
    <text x="153" y="792" class="text" font-size="16" font-weight="760">双指针</text>
    <text x="1327" y="791" text-anchor="end" class="muted small">0 / 4 已通过</text>
    <circle cx="126" cy="826" r="8" fill="none" stroke="#3a455a" stroke-width="1.5"/>
