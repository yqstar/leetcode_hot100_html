    <text x="1083" y="389" class="faint small">次</text>

    <rect x="90" y="445" width="1260" height="64" rx="15" class="surface" filter="url(#shadow)"/>
    <rect x="103" y="457" width="765" height="40" rx="10" fill="#1c2332" stroke="#2b3446"/>
    <text x="123" y="482" class="faint" font-size="18">⌕</text>
