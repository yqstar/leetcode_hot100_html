    <rect x="1278" y="813" width="50" height="25" rx="12.5" fill="#183b33"/>
    <text x="1303" y="830" text-anchor="middle" fill="#5fd0a5" font-size="11" font-weight="650">简单</text>

    <text x="720" y="880" text-anchor="middle" class="faint" font-size="11">题目列表页 · 深色模式界面示意</text>
