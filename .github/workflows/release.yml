name: Release LC Offline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Check tag commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.main-check.outputs.publish }}

    steps:
      - name: Check out tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether tagged commit is contained in main
        id: main-check
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME points to a commit contained in main."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::$GITHUB_REF_NAME is not contained in main. Merge it into main before publishing a release."
          fi

  release:
    name: Build and publish compact HTML
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and test offline files
        run: node scripts/project.mjs test

      - name: Verify release asset
        run: test -s lc_offline_compact.html

      - name: Create release and upload compact HTML
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" lc_offline_compact.html --clobber
          else
            gh release create "$RELEASE_TAG" lc_offline_compact.html \
              --verify-tag \
              --generate-notes \
              --title "LC Offline $RELEASE_TAG"
          fi
